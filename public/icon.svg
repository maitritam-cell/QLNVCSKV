<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M256 32 L430 88 C430 260 360 410 256 476 C152 410 82 260 82 88 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Inner Border Line -->
  <path d="M256 64 L396 110 C396 250 338 376 256 432 C174 376 116 250 116 110 Z" 
        fill="none" 
        stroke="#fef08a" 
        stroke-width="3" 
        stroke-opacity="0.6" />

  <!-- Central Gold Star -->
  <g transform="translate(256, 230) scale(0.95)" filter="url(#shadow)">
    <polygon points="0,-100 29,-32 100,-28 46,18 64,88 0,50 -64,88 -46,18 -100,-28 -29,-32" 
             fill="url(#goldGrad)" 
             stroke="#b45309" 
             stroke-width="3" />
  </g>

  <!-- Wreath / Embellishment base -->
  <path d="M170 330 C200 370 312 370 342 330" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="8" 
        stroke-linecap="round" />
  <circle cx="256" cy="355" r="8" fill="#fbbf24" />
</svg>
