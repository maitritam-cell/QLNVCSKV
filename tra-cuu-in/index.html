<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tra cứu & In hồ sơ</title><style>body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;color:#172033}.top{background:#0b3d91;color:white;padding:28px 18px;text-align:center}.wrap{max-width:900px;margin:25px auto;padding:0 15px}.box{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}.search{display:flex;gap:10px}.search input{flex:1;padding:15px;border:1px solid #ccd4e0;border-radius:10px;font-size:18px}.btn{border:0;border-radius:10px;padding:14px 18px;cursor:pointer;background:#0b3d91;color:#fff;font-size:16px}.result{margin-top:15px;padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px}.muted{color:#667085}.badge{background:#e8eefc;color:#0b3d91;border-radius:20px;padding:4px 9px;font-size:13px}@media(max-width:600px){.search,.result{flex-direction:column}.btn{width:100%}}</style></head><body><div class="top"><h1>TRA CỨU & IN HỒ SƠ</h1><div>Nhập họ tên để tìm nhanh hồ sơ PDF</div></div><main class="wrap"><section class="box"><div class="search"><input id="q" autofocus placeholder="Ví dụ: Bùi Duy Hương"><button class="btn" onclick="search()">Tra cứu</button></div><p id="count" class="muted"></p><div id="results"><div class="muted">Đang tải danh sách hồ sơ...</div></div></section></main><script>let files=[];async function init(){try{const r=await fetch('./files.json');files=await r.json();render(files)}catch(e){document.getElementById('results').innerHTML='<div class="muted">Chưa có dữ liệu hồ sơ. Hãy tải files.json và thư mục PDF lên website.</div>'}}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/đ/g,'d')}function search(){const q=norm(document.getElementById('q').value.trim());const a=q?files.filter(x=>norm(x.name).includes(q)):files;render(a)}function render(a){document.getElementById('count').textContent='Tìm thấy '+a.length+' hồ sơ';const b=document.getElementById('results');if(!a.length){b.innerHTML='<div class="muted">Không tìm thấy hồ sơ phù hợp.</div>';return}b.innerHTML=a.map((x,i)=>'<div class="result"><div><b>'+((i+1)+'. '+x.name)+'</b> <span class="badge">PDF</span></div><a class="btn" target="_blank" href="'+x.file+'">MỞ / IN</a></div>').join('')}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});init();</script></body></html>
